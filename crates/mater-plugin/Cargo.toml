[package]
name = "mater"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A polyphonic, MPE, microtonal CLAP port of the Bastl microGranny 2.5"

[lib]
crate-type = ["cdylib", "lib"]

# A standalone build, mostly so the engine and editor can be driven without a host.
[[bin]]
name = "mater-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nih_plug/standalone"]

[dependencies]
granny-core = { path = "../granny-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = [
    "assert_process_allocs",
] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

# Sample decoding. `all` covers wav, aiff, flac, mp3, ogg/vorbis and the mp4 family.
symphonia = { version = "0.5", features = ["all"] }

rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"
